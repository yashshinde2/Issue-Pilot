name: Issue Pilot CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up CMake and C++ Compiler
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.25.x'

    - name: Build C++ Ranking Engine & Run Unit Tests
      run: |
        cmake -S ranking_engine -B ranking_engine/build -DCMAKE_BUILD_TYPE=Release
        cmake --build ranking_engine/build --config Release
        chmod +x ranking_engine/build/issue_pilot_ranking_engine || true
        chmod +x ranking_engine/build/test_ranking || true
        chmod +x ranking_engine/build/test_affinity || true
        ./ranking_engine/build/test_ranking
        ./ranking_engine/build/test_affinity

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run Backend Java Test Suite
      env:
        CPP_ENGINE_PATH: ranking_engine/build/issue_pilot_ranking_engine
        MONGODB_URI: "mongodb://localhost:27017"
        SCHEDULER_ENABLED: "false"
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mvn test

    - name: Package Spring Boot Executable JAR
      run: |
        mvn package -DskipTests
