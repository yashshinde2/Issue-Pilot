name: Issue Pilot Daily Ingestion

# Runs daily at 06:00 Asia/Kolkata (IST), equivalent to 00:30 UTC.
# This workflow is intentionally staging-only. Production requires a separate approved rollout.
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target environment (staging only)'
        required: true
        default: 'staging'
        type: choice
        options:
          - 'staging'
      creation_age_days:
        description: 'Creation age window in days (7 or 30)'
        required: true
        default: '30'
        type: choice
        options:
          - '7'
          - '30'
      source:
        description: 'Target platform source'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'github'
          - 'gitlab'
          - 'codeberg'
          - 'bugzilla'
      max_pages:
        description: 'Max search pages per stack'
        required: false
        default: '2'
      per_page:
        description: 'Issues per page'
        required: false
        default: '15'
      refresh_batch:
        description: 'Batch size for refreshing open issues'
        required: false
        default: '50'

permissions:
  contents: read

jobs:
  daily-ingestion:
    name: Run Multi-Platform Daily Ingestion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Executable JAR
        run: |
          set -euo pipefail
          mvn clean package -DskipTests

      - name: Fail-Closed Staging Preflight Guard
        env:
          TARGET_ENV: ${{ github.event_name == 'schedule' && 'staging' || inputs.target_env || 'staging' }}
          STAGING_MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
          EXPECTED_STAGING_HOST: ${{ secrets.EXPECTED_STAGING_HOST || vars.EXPECTED_STAGING_HOST }}
        run: |
          set -euo pipefail

          if [ "${TARGET_ENV}" != "staging" ]; then
            echo "::error::Only staging is authorized by this workflow."
            exit 1
          fi

          if [ -z "${STAGING_MONGODB_URI:-}" ]; then
            echo "::error::STAGING_MONGODB_URI is missing. No production fallback is allowed."
            exit 1
          fi

          if [ -z "${EXPECTED_STAGING_HOST:-}" ]; then
            echo "::error::EXPECTED_STAGING_HOST secret or variable is required."
            exit 1
          fi

          echo "Staging configuration is present; Java preflight will verify isolation."

      - name: Audit Staging Isolation (Java Preflight)
        env:
          STAGING_MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
          MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
          MONGODB_DATABASE: "issue_pilot_staging"
          EXPECTED_STAGING_HOST: ${{ secrets.EXPECTED_STAGING_HOST || vars.EXPECTED_STAGING_HOST }}
          SCHEDULER_ENABLED: "false"
        run: |
          set -euo pipefail
          java -Dspring.main.web-application-type=none             -jar target/issue-pilot-*.jar             --preflight-staging             --expected-host="${EXPECTED_STAGING_HOST}"

      - name: Run Standalone Ingestion Batch
        env:
          STAGING_MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
          MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
          MONGODB_DATABASE: "issue_pilot_staging"
          TARGET_ENV: "staging"
          EXPECTED_STAGING_HOST: ${{ secrets.EXPECTED_STAGING_HOST || vars.EXPECTED_STAGING_HOST }}
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          BUGZILLA_BASE_URL: ${{ vars.BUGZILLA_BASE_URL || secrets.BUGZILLA_BASE_URL }}
          BUGZILLA_API_KEY: ${{ secrets.BUGZILLA_API_KEY }}
          SCHEDULER_ENABLED: "false"
          INGESTION_ENABLED: "true"
        run: |
          set -euo pipefail

          # Scheduled runs always use all platforms and a 30-day creation window.
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            DAYS="30"
            SRC="all"
            PAGES="2"
            PER_PAGE="15"
            BATCH="50"
          else
            DAYS="${{ inputs.creation_age_days || '30' }}"
            SRC="${{ inputs.source || 'all' }}"
            PAGES="${{ inputs.max_pages || '2' }}"
            PER_PAGE="${{ inputs.per_page || '15' }}"
            BATCH="${{ inputs.refresh_batch || '50' }}"
          fi

          echo "Starting ingestion: target_env=staging, days=${DAYS}, source=${SRC}, pages=${PAGES}, per_page=${PER_PAGE}, refresh_batch=${BATCH}"

          set +e
          java -Dspring.main.web-application-type=none             -jar target/issue-pilot-*.jar             --daily-ingestion             --target-env=staging             --expected-host="${EXPECTED_STAGING_HOST}"             --days="${DAYS}"             --source="${SRC}"             --pages="${PAGES}"             --per-page="${PER_PAGE}"             --refresh-batch="${BATCH}" 2>&1 | tee ingestion_output.txt
          PIPE_STATUS="${PIPESTATUS[0]}"
          set -e

          if [ "${PIPE_STATUS}" -ne 0 ]; then
            echo "::error::Ingestion failed with exit status ${PIPE_STATUS}"
            exit "${PIPE_STATUS}"
          fi

      - name: Generate Summary Report
        if: always()
        env:
          RUN_TARGET: ${{ github.event_name == 'schedule' && 'staging' || inputs.target_env || 'staging' }}
          RUN_SOURCE: ${{ github.event_name == 'schedule' && 'all' || inputs.source || 'all' }}
          RUN_DAYS: ${{ github.event_name == 'schedule' && '30' || inputs.creation_age_days || '30' }}
        run: |
          {
            echo "### Issue Pilot Daily Ingestion"
            echo "- **Target environment:** ${RUN_TARGET}"
            echo "- **Execution mode:** ${{ github.event_name }}"
            echo "- **Platforms:** ${RUN_SOURCE}"
            echo "- **Creation-age window:** ${RUN_DAYS} days"
            echo "- **Scheduled time:** 06:00 Asia/Kolkata (00:30 UTC)"
            echo ""
            if [ -f ingestion_output.txt ]; then
              echo "#### Execution log tail"
              echo '```text'
              grep -A 50 "DAILY INGESTION COMPLETE" ingestion_output.txt || tail -n 40 ingestion_output.txt
              echo '```'
            else
              echo "No ingestion output was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
