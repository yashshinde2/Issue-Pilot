name: Issue Pilot Daily Ingestion

on:
  schedule:
    # 6:00 AM IST (UTC+5:30) is 00:30 UTC every day
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target environment (must be staging; production requires explicit separate rollout)'
        required: true
        default: 'staging'
        type: choice
        options:
          - 'staging'
      creation_age_days:
        description: 'Creation age window in days (7 or 30)'
        required: false
        default: '30'
        type: choice
        options:
          - '30'
          - '7'
      source:
        description: 'Target platform source'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'github'
          - 'gitlab'
          - 'codeberg'
          - 'bugzilla'
      max_pages:
        description: 'Max search pages per stack'
        required: false
        default: '2'
      per_page:
        description: 'Issues per page'
        required: false
        default: '15'
      refresh_batch:
        description: 'Batch size for refreshing open issues'
        required: false
        default: '50'

permissions:
  contents: read

jobs:
  daily-ingestion:
    name: Run Multi-Platform Daily Ingestion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Executable JAR
        run: |
          set -euo pipefail
          mvn clean package -DskipTests

      - name: Fail-Closed Staging Preflight Guard
        env:
          TARGET_ENV: ${{ inputs.target_env || 'staging' }}
          STAGING_MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
          # Trusted repository secret/variable only; no user-provided override or placeholder fallback.
          EXPECTED_STAGING_HOST: ${{ secrets.EXPECTED_STAGING_HOST || vars.EXPECTED_STAGING_HOST }}
        run: |
          set -euo pipefail
          echo "================================================="
          echo " Issue Pilot Staging Preflight Guard"
          echo "================================================="

          if [ "${TARGET_ENV}" != "staging" ]; then
            echo "::error::Only 'staging' environment is authorized for this workflow. Production runs are strictly prohibited."
            exit 1
          fi

          if [ -z "${STAGING_MONGODB_URI:-}" ]; then
            echo "::error::STAGING_MONGODB_URI secret is missing or empty."
            echo "::error::Staging runs require a dedicated STAGING_MONGODB_URI secret."
            echo "::error::This workflow will NEVER silently fall back to MONGODB_URI."
            exit 1
          fi

          if [ -z "${EXPECTED_STAGING_HOST:-}" ]; then
            echo "::error::Expected staging cluster host is missing or unconfigured."
            echo "::error::Set EXPECTED_STAGING_HOST to the verified Atlas hostname or supported hostname suffix."
            exit 1
          fi

          echo "Staging environment authorized, STAGING_MONGODB_URI secret verified, and expected host configured."

      - name: Audit Staging Isolation (Java Preflight)
        env:
          STAGING_MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
          MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
          MONGODB_DATABASE: "issue_pilot_staging"
          EXPECTED_STAGING_HOST: ${{ secrets.EXPECTED_STAGING_HOST || vars.EXPECTED_STAGING_HOST }}
          SCHEDULER_ENABLED: "false"
        run: |
          set -euo pipefail
          echo "Executing fail-closed Java staging isolation audit..."
          java -Dspring.main.web-application-type=none \
            -jar target/issue-pilot-*.jar \
            --preflight-staging \
            --expected-host="${EXPECTED_STAGING_HOST}"

      - name: Run Standalone Ingestion Batch
        env:
          STAGING_MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
          MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
          MONGODB_DATABASE: "issue_pilot_staging"
          TARGET_ENV: "staging"
          EXPECTED_STAGING_HOST: ${{ secrets.EXPECTED_STAGING_HOST || vars.EXPECTED_STAGING_HOST }}
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          BUGZILLA_BASE_URL: ${{ secrets.BUGZILLA_BASE_URL || vars.BUGZILLA_BASE_URL }}
          BUGZILLA_API_KEY: ${{ secrets.BUGZILLA_API_KEY }}
          SCHEDULER_ENABLED: "false"
          INGESTION_ENABLED: "true"
          DAYS: ${{ inputs.creation_age_days || '30' }}
          SRC: ${{ inputs.source || 'all' }}
          PAGES: ${{ inputs.max_pages || '2' }}
          PER_PAGE: ${{ inputs.per_page || '15' }}
          BATCH: ${{ inputs.refresh_batch || '50' }}
        run: |
          set -euo pipefail
          DAYS="${DAYS:-30}"
          SRC="${SRC:-all}"
          PAGES="${PAGES:-2}"
          PER_PAGE="${PER_PAGE:-15}"
          BATCH="${BATCH:-50}"
          EXP_HOST="${EXPECTED_STAGING_HOST}"

          echo "Starting Issue Pilot ingestion batch (target_env=staging, days=${DAYS}, source=${SRC}, pages=${PAGES}, per_page=${PER_PAGE}, refresh_batch=${BATCH})..."

          set +e
          java -Dspring.main.web-application-type=none \
            -jar target/issue-pilot-*.jar \
            --daily-ingestion \
            --target-env=staging \
            --expected-host="${EXP_HOST}" \
            --days="${DAYS}" \
            --source="${SRC}" \
            --pages="${PAGES}" \
            --per-page="${PER_PAGE}" \
            --refresh-batch="${BATCH}" 2>&1 | tee ingestion_output.txt
          PIPE_STATUS="${PIPESTATUS[0]}"
          set -e

          if [ "${PIPE_STATUS}" -ne 0 ]; then
            echo "Ingestion command failed with exit status ${PIPE_STATUS}"
            exit "${PIPE_STATUS}"
          fi

      - name: Generate Summary Report
        if: always()
        run: |
          {
            echo "### Issue Pilot Daily Ingestion Run"
            echo "- **Target Environment**: ${{ inputs.target_env || 'staging' }}"
            echo "- **Execution Mode**: Standalone CLI runner (non-web)"
            echo "- **Platforms Targeted**: ${{ inputs.source || 'all' }}"
            echo "- **Creation-Age Window**: ${{ inputs.creation_age_days || '30' }} days"

            if [ -f ingestion_output.txt ]; then
              OVERALL_STATUS=$(python3 -c "
          import json
          try:
              with open('ingestion_output.txt') as f:
                  text = f.read()
              idx = text.find('--- DAILY INGESTION COMPLETE ---')
              if idx != -1:
                  data = json.loads(text[idx + len('--- DAILY INGESTION COMPLETE ---'):].strip())
                  print(data.get('overall_status', 'unknown'))
              else:
                  print('unknown')
          except Exception:
              print('unknown')
          " 2>/dev/null || echo "unknown")
              echo "- **Overall Status**: \`${OVERALL_STATUS}\`"
              echo ""
              if [ "${OVERALL_STATUS}" = "partial_success" ]; then
                echo "> [!WARNING]"
                echo "> Ingestion completed with **partial_success**. Some platform adapters experienced partial failures or used fallbacks."
                echo ""
              fi
              echo "#### Execution Log Output"
              echo '```json'
              python3 -c "
          import json
          try:
              with open('ingestion_output.txt') as f:
                  text = f.read()
              idx = text.find('--- DAILY INGESTION COMPLETE ---')
              if idx != -1:
                  data = json.loads(text[idx + len('--- DAILY INGESTION COMPLETE ---'):].strip())
                  print(json.dumps(data, indent=2))
              else:
                  raise ValueError()
          except Exception:
              with open('ingestion_output.txt') as f:
                  lines = f.readlines()
              print(''.join(lines[-40:]).strip())
          " 2>/dev/null || (grep -A 50 "DAILY INGESTION COMPLETE" ingestion_output.txt || tail -n 40 ingestion_output.txt)
              echo '```'
            else
              echo ""
              echo "No ingestion output was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
