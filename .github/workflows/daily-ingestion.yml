name: Issue Pilot Daily Ingestion

# Production schedule is disabled until a separate, explicitly approved rollout plan exists.
# on:
#   schedule:
#     - cron: '0 3 * * *'

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target environment (must be staging; production requires explicit separate rollout)'
        required: true
        default: 'staging'
        type: choice
        options:
          - 'staging'
      creation_age_days:
        description: 'Creation age window in days (7 or 30)'
        required: false
        default: '30'
        type: choice
        options:
          - '7'
          - '30'
      source:
        description: 'Target platform source'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'github'
          - 'gitlab'
          - 'codeberg'
          - 'bugzilla'
      max_pages:
        description: 'Max search pages per stack'
        required: false
        default: '2'
      per_page:
        description: 'Issues per page'
        required: false
        default: '15'
      refresh_batch:
        description: 'Batch size for refreshing open issues'
        required: false
        default: '50'
      expected_staging_host:
        description: 'Expected staging cluster host or pattern (e.g. staging-cluster or staging.mongodb.net)'
        required: false
        default: 'staging'

permissions:
  contents: read

jobs:
  daily-ingestion:
    name: Run Multi-Platform Daily Ingestion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Executable JAR
        run: |
          set -euo pipefail
          mvn clean package -DskipTests

      - name: Fail-Closed Staging Preflight Guard
        env:
          TARGET_ENV: ${{ inputs.target_env || 'staging' }}
          STAGING_MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
          EXPECTED_STAGING_HOST: ${{ inputs.expected_staging_host || secrets.EXPECTED_STAGING_HOST || vars.EXPECTED_STAGING_HOST || 'staging' }}
        run: |
          set -euo pipefail
          echo "================================================="
          echo " Issue Pilot Staging Preflight Guard"
          echo "================================================="

          if [ "${TARGET_ENV}" != "staging" ]; then
            echo "::error::Only 'staging' environment is authorized for this workflow. Production runs are strictly prohibited."
            exit 1
          fi

          if [ -z "${STAGING_MONGODB_URI:-}" ]; then
            echo "::error::STAGING_MONGODB_URI secret is missing or empty."
            echo "::error::Staging runs require a dedicated STAGING_MONGODB_URI secret."
            echo "::error::This workflow will NEVER silently fall back to MONGODB_URI."
            exit 1
          fi

          if [ -z "${EXPECTED_STAGING_HOST:-}" ]; then
            echo "::error::Expected staging cluster host is missing or unconfigured."
            echo "::error::Staging runs require an explicit, verified EXPECTED_STAGING_HOST."
            exit 1
          fi

          echo "Staging environment authorized, STAGING_MONGODB_URI secret verified, and expected host configured."

      - name: Audit Staging Isolation (Java Preflight)
        env:
          STAGING_MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
          MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
          MONGODB_DATABASE: "issue_pilot_staging"
          EXPECTED_STAGING_HOST: ${{ inputs.expected_staging_host || secrets.EXPECTED_STAGING_HOST || vars.EXPECTED_STAGING_HOST || 'staging' }}
          SCHEDULER_ENABLED: "false"
        run: |
          set -euo pipefail
          echo "Executing fail-closed Java staging isolation audit..."
          java -Dspring.main.web-application-type=none \
            -jar target/issue-pilot-*.jar \
            --preflight-staging \
            --expected-host="${EXPECTED_STAGING_HOST}"

      - name: Run Standalone Ingestion Batch
        env:
          # Required database connection secret: strictly staging
          STAGING_MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
          MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
          MONGODB_DATABASE: "issue_pilot_staging"
          TARGET_ENV: "staging"
          EXPECTED_STAGING_HOST: ${{ inputs.expected_staging_host || secrets.EXPECTED_STAGING_HOST || vars.EXPECTED_STAGING_HOST || 'staging' }}
          # Platform credentials (token/apiKey optional or recommended depending on rate-limit needs)
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          BUGZILLA_API_KEY: ${{ secrets.BUGZILLA_API_KEY }}
          # Ingestion settings: disable internal recurring scheduler in CLI batch mode
          SCHEDULER_ENABLED: "false"
          INGESTION_ENABLED: "true"
        run: |
          set -euo pipefail
          DAYS="${{ inputs.creation_age_days || '30' }}"
          SRC="${{ inputs.source || 'all' }}"
          PAGES="${{ inputs.max_pages || '2' }}"
          PER_PAGE="${{ inputs.per_page || '15' }}"
          BATCH="${{ inputs.refresh_batch || '50' }}"
          EXP_HOST="${EXPECTED_STAGING_HOST}"

          echo "Starting Issue Pilot daily ingestion batch (target_env=staging, days=${DAYS}, source=${SRC}, pages=${PAGES}, per_page=${PER_PAGE}, refresh_batch=${BATCH})..."

          java -Dspring.main.web-application-type=none \
            -jar target/issue-pilot-*.jar \
            --daily-ingestion \
            --target-env=staging \
            --expected-host="${EXP_HOST}" \
            --days="${DAYS}" \
            --source="${SRC}" \
            --pages="${PAGES}" \
            --per-page="${PER_PAGE}" \
            --refresh-batch="${BATCH}" | tee ingestion_output.txt

          PIPE_STATUS="${PIPESTATUS[0]}"
          if [ "${PIPE_STATUS}" -ne 0 ]; then
            echo "Ingestion command failed with exit status ${PIPE_STATUS}"
            exit "${PIPE_STATUS}"
          fi

      - name: Generate Summary Report
        if: always()
        run: |
          echo "### Issue Pilot Daily Ingestion Run" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment**: ${{ inputs.target_env || 'staging' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Mode**: Standalone CLI runner (non-web)" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms Targeted**: ${{ inputs.source || 'all' }} (GitHub, GitLab, Codeberg, Bugzilla)" >> $GITHUB_STEP_SUMMARY
          echo "- **Creation-Age Window**: ${{ inputs.creation_age_days || '30' }} days" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f ingestion_output.txt ]; then
            echo "#### Execution Log Tail" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            grep -A 50 "DAILY INGESTION COMPLETE" ingestion_output.txt || tail -n 40 ingestion_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
